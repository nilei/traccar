services:

  app:
    image: eclipse-temurin:21-jdk
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "chmod +x gradlew && ./gradlew assemble --no-daemon && java -jar target/tracker-server.jar debug.xml"
    environment:
      - web.address=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/api/server"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped

  web:
    image: node:22
    working_dir: /web
    volumes:
      - ./traccar-web:/web
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://app:8082
      - VITE_API_WS_TARGET=ws://app:8082
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
